    <meta name="theme-color" content="#f4f8ff" />
    <script>
      // Apply saved theme before first paint to avoid a flash of the wrong colors.
      (function () {
        var ids = ["quantix", "aurora", "midnight", "ocean", "sunset", "forest", "candy"];
        var t = null;
        try { t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("quantix-theme"); } catch (e) {}
        if (ids.indexOf(t) < 0) t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "quantix" : "midnight";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <title>Quantix AI Solutions — Turning Data into Intelligence</title>
